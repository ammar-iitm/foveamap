[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foveamap"
version = "0.1.0"
description = "Adaptive Variable Resolution 2.5D LiDAR Mapping for Dynamic Environment Perception"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "FoveaMap Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Robotics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "torch>=2.0",
]

[project.scripts]
foveamap = "foveamap.cli:main"
foveamap-ros = "foveamap_ros.node:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["foveamap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "default::RuntimeWarning",
]
markers = [
    "unit: fast, hermetic unit tests (no hardware, no ROS2).",
    "integration: multi-component tests on deterministic fixtures.",
    "adversarial: malformed-input and invariant-stress tests.",
    "cuda: requires physical CUDA hardware (skipped on CPU hosts).",
    "ros2: requires a ROS2 environment with rclpy (skipped otherwise).",
    "slow: tests taking minutes; excluded from the fast loop.",
    "benchmark: performance-oriented tests; not correctness gates.",
    "hardware: requires physical hardware (CUDA or sensor); never runs in CPU CI.",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
