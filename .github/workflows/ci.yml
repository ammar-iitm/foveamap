name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + package + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Import check
        run: python -c "import foveamap; print(foveamap.__name__)"
      - name: CLI smoke (info)
        run: python -m foveamap.cli info
      - name: CLI smoke (demo, 2 frames)
        run: python -m foveamap.cli demo --frames 2
      - name: Lint (ruff, if available)
        run: python scripts/dev.py lint
      - name: Fast tests (excludes cuda/ros2/slow markers)
        run: python scripts/dev.py test-fast
